# Production call policy — no _public storage access.
# Dev overlay: policies-dev.yaml (selected by MUXCORE_PROFILE=dev in run-host.sh).

# Allow downloader to read/write storage
- caller: "downloader-qbittorrent"
  target: "storage-local"
  methods: ["Put", "Get", "Stat", "Delete"]

# Native torrent client streams pieces via StorageService
- caller: "downloader-native-torrent"
  target: "storage"
  methods: ["read", "write"]

# Indexers may cache .torrent / magnet metadata in storage
- caller: "indexer-torznab"
  target: "storage"
  methods: ["read", "write"]
- caller: "indexer-piratebay"
  target: "storage"
  methods: ["read", "write"]
- caller: "indexer-mux"
  target: "storage"
  methods: ["read", "write"]

# Allow scanner to read (ImportPath storage://) and write library objects
- caller: "media-scanner"
  target: "storage"
  methods: ["read", "write"]

# Allow transcoder to read and stream from storage
- caller: "transcoder-ffmpeg"
  target: "storage-local"
  methods: ["Get", "Stream", "Stat"]

# Allow media managers to query each other
- caller: "media-movies"
  target: "media-tv"
  methods: ["Search", "Lookup"]

# Allow media-jellyfin to stream from storage
- caller: "media-jellyfin"
  target: "storage"
  methods: ["read", "write"]

# Allow any authenticated module to check auth status
- caller: "*"
  target: "auth-local"
  methods: ["Validate"]

# Catch-all deny (explicit; uncomment only in policies-dev.yaml)
# - caller: "*"
#   target: "*"
#   methods: ["*"]
